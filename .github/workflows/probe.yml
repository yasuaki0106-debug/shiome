name: 接続テスト（手動）
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: fetch
        run: python scripts/fetch_onchain.py
      - name: cors
        shell: bash
        run: |
          set +e
          O="https://yasuaki0106-debug.github.io"; OUT=research/probe2.txt; : > $OUT
          for u in "https://api.alternative.me/fng/?limit=2" "https://community-api.coinmetrics.io/v4/timeseries/asset-metrics?assets=btc&metrics=CapMVRVCur&frequency=1d&page_size=2" "https://api.blockchain.info/charts/hash-rate?timespan=1week&format=json&cors=true"; do
            echo "===== $u" >> $OUT; curl -s -m 30 -D /tmp/h -o /tmp/b -H "Origin: $O" "$u"; head -1 /tmp/h >> $OUT; grep -i '^access-control-allow-origin' /tmp/h >> $OUT; head -c 300 /tmp/b >> $OUT; echo >> $OUT
          done
          git config user.name "shiome-bot"; git config user.email "shiome-bot@users.noreply.github.com"
          git add $OUT data/onchain.json; git commit -m "指標の取得と接続テスト" && git push
