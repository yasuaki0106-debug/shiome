name: 接続診断
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe.py
      - run: |
          git config user.name "shiome-bot"; git config user.email "shiome-bot@users.noreply.github.com"
          git add data/probe.json; git diff --cached --quiet || (git commit -m "接続診断" && git pull --rebase && git push)
