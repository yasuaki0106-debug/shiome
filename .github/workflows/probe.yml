name: 接続テスト（手動）
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        shell: bash
        run: |
          set +e
          O="https://yasuaki0106-debug.github.io"
          OUT=research/probe.txt; mkdir -p research; : > $OUT
          p(){ echo "===== $1" >> $OUT; curl -s -m 20 -o /tmp/b -D /tmp/h -H "Origin: $O" "${@:2}"; head -1 /tmp/h >> $OUT; grep -i '^access-control' /tmp/h >> $OUT; head -c 500 /tmp/b >> $OUT; echo >> $OUT; }
          pf(){ echo "===== preflight $1" >> $OUT; curl -s -m 20 -D /tmp/h -o /dev/null -X OPTIONS -H "Origin: $O" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: $2" "$3"; grep -iE '^HTTP|^access-control' /tmp/h >> $OUT; }
          pf token "content-type" https://webapi.moomoo.com/oauth2/token
          pf quote "authorization,content-type" https://webapi.moomoo.com/api/v1.0/quote/stock-quote
          pf register "content-type" https://webapi.moomoo.com/oauth2/register
          p "moomoo quote without token" -X POST -H "Content-Type: application/json" -d '{"code_list":["US.MSTR"]}' https://webapi.moomoo.com/api/v1.0/quote/stock-quote
          p "moomoo server-time" https://webapi.moomoo.com/api/v1.0/server-time
          p "moomoo authorize page" "https://webapi.moomoo.com/oauth2/authorize/confirm"
          p "bybit ticker" "https://api.bybit.com/v5/market/tickers?category=linear&symbol=BTCUSDT"
          p "bybit oi" "https://api.bybit.com/v5/market/open-interest?category=linear&symbol=BTCUSDT&intervalTime=4h&limit=3"
          p "bybit ratio" "https://api.bybit.com/v5/market/account-ratio?category=linear&symbol=BTCUSDT&period=4h&limit=3"
          p "okx oi" "https://www.okx.com/api/v5/public/open-interest?instType=SWAP&instId=BTC-USDT-SWAP"
          p "okx funding" "https://www.okx.com/api/v5/public/funding-rate?instId=BTC-USDT-SWAP"
          p "okx oi hist" "https://www.okx.com/api/v5/rubik/stat/contracts/open-interest-history?instId=BTC-USDT-SWAP&period=4H&limit=3"
          p "okx ls" "https://www.okx.com/api/v5/rubik/stat/contracts/long-short-account-ratio?ccy=BTC&period=4H"
          p "cb ticker" "https://api.exchange.coinbase.com/products/BTC-USD/ticker"
          p "cb candles" "https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=86400&start=2015-08-01T00:00:00Z&end=2015-08-05T00:00:00Z"
          p "binance vision" "https://data-api.binance.vision/api/v3/klines?symbol=BTCUSDT&interval=1d&limit=2"
          p "binance fapi" "https://fapi.binance.com/fapi/v1/premiumIndex?symbol=BTCUSDT"
          p "deribit" "https://www.deribit.com/api/v2/public/get_index_price?index_name=btc_usd"
          git config user.name "shiome-bot"; git config user.email "shiome-bot@users.noreply.github.com"
          git add $OUT; git commit -m "接続テストの結果" && git push
