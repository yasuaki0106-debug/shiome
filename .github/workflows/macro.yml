name: 検証用の市場データ（手動）
on: workflow_dispatch
permissions:
  contents: write
jobs:
  m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_macro.py
      - run: |
          git config user.name "shiome-bot"; git config user.email "shiome-bot@users.noreply.github.com"
          git add research/macro.json && git commit -m "検証用の市場データ" && (git push || (git pull --rebase && git push))
