name: 検証用データの取得（手動）
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_research.py
      - run: |
          git config user.name "shiome-bot"; git config user.email "shiome-bot@users.noreply.github.com"
          git add research/ && git commit -m "検証用データ" && git push || true
