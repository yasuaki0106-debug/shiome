name: 株価のリアルタイム取得の確認（手動）
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set +e
          O="https://yasuaki0106-debug.github.io"; OUT=research/probe3.txt; : > $OUT
          probe(){ echo "===== $1" >> $OUT; curl -s -m 25 -D /tmp/h -o /tmp/b -H "Origin: $O" -H "User-Agent: Mozilla/5.0" "$1"; head -1 /tmp/h >> $OUT; grep -i '^access-control-allow-origin' /tmp/h >> $OUT; head -c 400 /tmp/b >> $OUT; echo >> $OUT; }
          probe "https://api.gateio.ws/api/v4/spot/tickers?currency_pair=COINX_USDT"
          probe "https://api.gateio.ws/api/v4/spot/tickers?currency_pair=MSTUX_USDT"
          probe "https://api.gateio.ws/api/v4/spot/candlesticks?currency_pair=MSTRX_USDT&interval=1h&limit=3"
          curl -s -m 25 "https://api.kraken.com/0/public/AssetPairs?aclass_base=tokenized_asset" | python3 -c "import json,sys;d=json.load(sys.stdin)['result'];print('KRAKEN', [v['altname'] for v in d.values() if v['altname'].startswith(('MSTR','COIN','MSTU','CONL'))])" >> $OUT
          probe "https://api.kraken.com/0/public/Ticker?pair=MSTRxUSD"
          git config user.name "shiome-bot"; git config user.email "shiome-bot@users.noreply.github.com"
          git add $OUT; git commit -m "株価の取得先の確認"; git push || (git pull --rebase && git push)
