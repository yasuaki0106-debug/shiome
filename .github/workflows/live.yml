name: 今の相場の控え（1時間ごと）
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live_snapshot.py
      - run: |
          git config user.name "shiome-bot"; git config user.email "shiome-bot@users.noreply.github.com"
          git add research/live.json && git commit -m "今の相場の控え" && git push || true
