name: 今の相場の控え（1時間ごと）
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/live_snapshot.py
      - run: python3 scripts/fetch_quotes.py
        continue-on-error: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/line_watch.js
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - run: |
          git config user.name "shiome-bot"; git config user.email "shiome-bot@users.noreply.github.com"
          git add research/live.json data/line_state.json data/quotes.json; git commit -m "今の相場の控え" && (git push || (git pull --rebase && git push)) || true
