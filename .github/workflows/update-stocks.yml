name: 株価とBTC履歴の自動取得
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 米国市場の終了後（夏時間）
    - cron: "30 22 * * 1-5"   # 米国市場の終了後（冬時間）
    - cron: "15 3 * * 2-6"    # 翌朝に確定値で取り直し
    - cron: "20 0 * * *"      # BTCの日足が確定した直後（毎日）
    - cron: "15 6 * * *"      # 予備
    - cron: "40 12 * * *"     # 建玉の履歴の補充
    - cron: "40 16 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stocks
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_stocks.py
        continue-on-error: true
      - run: python scripts/update_btc.py
        continue-on-error: true
      - run: python scripts/update_okx.py
        continue-on-error: true
      - run: python scripts/fetch_onchain.py
        continue-on-error: true
      - run: python scripts/fetch_news.py
        continue-on-error: true
      - run: python scripts/update_premium.py
        continue-on-error: true
      - name: 変更があれば保存
        run: |
          git config user.name "shiome-bot"
          git config user.email "shiome-bot@users.noreply.github.com"
          git add data/stocks.json data/btc-usd-daily.csv data/okx_oi.json data/cb-premium.csv
          git diff --cached --quiet || (git commit -m "データを更新" && git push)
