name: ニュース取得の確認（手動）
on: workflow_dispatch
permissions:
  contents: write
jobs:
  dbg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: run
        shell: bash
        run: |
          set +e
          python scripts/fetch_news.py > research/news_debug.txt 2>&1
          echo "exit $?" >> research/news_debug.txt
          ls -la data >> research/news_debug.txt
          curl -s -m 20 -o /dev/null -w "gnews %{http_code}\n" "https://news.google.com/rss/search?q=Coinbase&hl=en-US&gl=US&ceid=US:en" >> research/news_debug.txt
          git config user.name "shiome-bot"; git config user.email "shiome-bot@users.noreply.github.com"
          git add research/news_debug.txt data/news.json 2>/dev/null; git add research/news_debug.txt; git commit -m "ニュース取得の確認" && git push
